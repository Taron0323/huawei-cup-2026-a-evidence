<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#edf7fa">
  <title>鹈鹕的海边骑行</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; color: #263d46; background: #edf7fa; color-scheme: light; }
    * { box-sizing: border-box; letter-spacing: 0; }
    body { margin: 0; }
    main { height: 100vh; height: 100svh; min-height: 360px; display: flex; flex-direction: column; }
    .scene { position: relative; flex: 1; min-height: 0; overflow: hidden; }
    h1 { position: absolute; z-index: 1; top: 32px; left: 40px; margin: 0; font-size: 26px; line-height: 1.5; font-weight: 600; }
    h1::after { content: ""; display: block; margin-top: 12px; width: 36px; height: 3px; background: #d96d69; }
    #landscape { display: block; width: 100%; height: 100%; }
    footer { min-height: 86px; flex: none; padding: 20px 24px max(20px, env(safe-area-inset-bottom)); border-top: 1px solid #d5e1df; background: #fcfdfc; }
    .controls { max-width: 400px; margin: auto; display: flex; align-items: center; gap: 14px; }
    button { position: relative; width: 44px; height: 44px; flex: 0 0 44px; display: grid; place-items: center; border: 1px solid #cad9d7; border-radius: 8px; background: #fcfdfc; color: #31534e; cursor: pointer; touch-action: manipulation; }
    button:hover { background: #e8f1ed; }
    #toggle { background: #316a60; color: white; border-color: #316a60; }
    #toggle:hover { background: #27584f; }
    button:active { transform: translateY(1px); }
    button svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    button::after { content: attr(data-tip); position: absolute; bottom: 54px; left: 50%; transform: translateX(-50%); padding: 6px 9px; font-size: 12px; white-space: nowrap; border-radius: 4px; background: #263d46; color: white; opacity: 0; pointer-events: none; }
    button:hover::after, button:focus-visible::after { opacity: 1; }
    :focus-visible { outline: 3px solid #cb7851; outline-offset: 4px; }
    .divider { height: 24px; width: 1px; flex: 0 0 1px; background: #dae4df; margin: 0 2px; }
    label { font-size: 13px; white-space: nowrap; }
    input { accent-color: #316a60; width: 100%; min-width: 40px; margin: 0; cursor: pointer; }
    output { font-size: 13px; font-variant-numeric: tabular-nums; flex: 0 0 36px; text-align: right; }
    [hidden] { display: none !important; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    @media (max-width: 600px) { h1 { top: 25px; left: 24px; font-size: 22px; } footer { padding-left: 18px; padding-right: 18px; } .controls { gap: 11px; } }
    @media (max-width: 350px) { .controls { gap: 8px; } footer { padding-left: 14px; padding-right: 14px; } }
    @media (max-height: 460px) and (min-width: 600px) { h1 { top: 18px; left: 24px; font-size: 20px; } footer { min-height: 64px; padding-top: 10px; padding-bottom: 10px; } }
  </style>
</head>
<body>
<main>

          <path d="M-194-333C-200-371-164-397-116-398C-75-404-51-387-33-383C-11-410-24-452 1-482C25-515 81-511 97-479C114-445 87-422 50-418C18-414 25-389 32-367C48-313-10-280-75-280C-144-278-189-299-194-333Z"/>

  <footer>
    <div class="controls" role="group" aria-label="骑行动画控制">

        <svg id="play-icon" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/></svg>
      </button>
      <button id="bell" type="button" aria-label="响铃" data-tip="响铃">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.268 21a2 2 0 0 0 3.464 0M22 8c0-2.3-.8-4.3-2-6M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326M4 2C2.8 3.7 2 5.7 2 8"/></svg>

    </div>
    <span id="announcement" class="sr-only" role="status" aria-live="polite"></span>

</main>
<script>
(() => {
  'use strict';
  const byId = id => document.getElementById(id);
  const scene = byId('landscape');
  const toggle = byId('toggle');
  const motion = typeof window !== 'undefined' && typeof window.matchMedia === 'function'
    ? window.matchMedia('(prefers-reduced-motion: reduce)')
    : { matches: false, addEventListener() {} };
  const nodes = {};
  if (scene && typeof scene.querySelectorAll === 'function') {
    scene.querySelectorAll('[id]').forEach(node => { nodes[node.id] = node; });
  }
  ['landscape', 'sun', 'cloud-a', 'cloud-b', 'islands', 'sea', 'horizon', 'ripples', 'lighthouse', 'boat', 'shore', 'road', 'road-marks', 'road-plants', 'rider', 'farLeg', 'far-leg-color', 'far-crank', 'far-foot', 'rearWheel', 'frontWheel', 'nearLeg', 'near-leg-color', 'near-crank', 'near-foot', 'pelican', 'scarf-tail', 'wing', 'eye', 'bell-rays', 'foreground-left', 'foreground-right'].forEach(id => {
    if (!nodes[id]) nodes[id] = byId(id);
  });
  const attr = (id, name, value) => nodes[id].setAttribute(name, String(value));
  const wrap = (n, length) => ((n % length) + length) % length;
  let width = 1440, height = 814, ground = 710, scale = 1, horizon = 480;
  const initialPhase = 28.4 * Math.PI / 180 / 1.65;
  let time = 0, speed = 1, playing = !motion.matches, frameId = 0, last = null, bellTime = 0, audio;
  const legs = ['near', 'far'].map(side => ({ side, far: side === 'far' }));
  const requestFrame = callback => typeof window !== 'undefined' && typeof window.requestAnimationFrame === 'function'
    ? window.requestAnimationFrame(callback)
    : 0;
  const cancelFrame = id => {
    if (typeof window !== 'undefined' && typeof window.cancelAnimationFrame === 'function') window.cancelAnimationFrame(id);
  };

  function leg(side, phase, bob, far) {
    const px = Math.cos(phase) * 39, py = -122 + Math.sin(phase) * 39;
    const hx = far ? -89 : -79, hy = -291 + bob;
    const ax = px, ay = py - 17, dx = ax - hx, dy = ay - hy, d = Math.hypot(dx, dy);
    // Two fixed-length segments keep each foot attached to its pedal.
    const along = (112 ** 2 - 118 ** 2 + d * d) / (2 * d);
    const bend = Math.sqrt(Math.max(0, 112 ** 2 - along ** 2));
    const kx = hx + along * dx / d + bend * dy / d;
    const ky = hy + along * dy / d - bend * dx / d;
    const path = `M${hx} ${hy}L${kx} ${ky}L${ax} ${ay}`;
    attr(`${side}Leg`, 'd', path);
    attr(`${side}-leg-color`, 'd', path);
    attr(`${side}-crank`, 'd', `M0-122L${px} ${py}`);
    attr(`${side}-foot`, 'transform', `translate(${px} ${py})`);
  }

  function render() {
    const angle = time * 2.9 + initialPhase, wheelAngle = angle * 1.65, distance = wheelAngle * 94;
    const bob = Math.sin(angle * 2) * 2.4;
    const wheelDegrees = (wheelAngle * 180 / Math.PI).toFixed(2);
    for (const id of ['rearWheel', 'frontWheel']) attr(id, 'transform', `rotate(${wheelDegrees})`);
    legs.forEach(({ side, far }) => leg(side, angle + (far ? Math.PI : 0), bob, far));
    attr('pelican', 'transform', `translate(0 ${bob})`);
    const flutter = Math.sin(time * 6) * 7;
    attr('scarf-tail', 'd', `M24-428Q-14-452-64-437Q-94 ${-429 + flutter}-119 ${-447 + flutter}L-108 ${-417 + flutter}L-80 ${-425 + flutter}Q-29-418 29-414Z`);
    attr('wing', 'd', `M-127-366C-87-390-41-365-13-344Q35-310 81-304L132 ${-300 - bob}Q147 ${-302 - bob} 146 ${-294 - bob}Q128 ${-282 - bob} 111-288Q119-279 104-281L67-287Q-13-303-46-315Q-93-302-130-321Q-150-332-127-366Z`);
    attr('eye', 'transform', `translate(75 -474) scale(1 ${time % 7.5 > 7.32 ? 0.12 : 1})`);
    attr('cloud-a', 'transform', `translate(${wrap(width * .23 - distance * .035, width + 200) - 50} ${Math.max(120, horizon * .34)}) scale(.8)`);
    attr('cloud-b', 'transform', `translate(${wrap(width * .68 - distance * .05, width + 200) - 50} ${Math.max(175, horizon * .6)}) scale(.6)`);
    attr('boat', 'transform', `translate(${wrap(width * .87 - distance * .07, width + 100) - 30} ${horizon + (ground - horizon) * .23}) scale(${width < 600 ? .48 : .7})`);
    nodes['road-marks'].setAttribute('transform', `translate(${-wrap(distance * scale, 180 * scale)} 0)`);
    nodes['road-plants'].setAttribute('transform', `translate(${-wrap(distance * scale, 360 * scale)} 0)`);
    attr('bell-rays', 'opacity', Math.min(1, bellTime * 3));
    attr('bell-rays', 'stroke-width', 2.5 + Math.sin(bellTime * 25));
  }

  function resize() {
    const box = scene && typeof scene.getBoundingClientRect === 'function'
      ? scene.getBoundingClientRect()
      : { width, height };
    width = Math.max(1, box.width); height = Math.max(1, box.height);
    ground = height * (width < 600 ? .73 : .87);
    scale = Math.max(.1, Math.min((width - 40) / 610, (ground - 96) / 525, 1.15));
    horizon = ground - 208 * scale;
    scene.setAttribute('viewBox', `0 0 ${width} ${height}`);
    attr('rider', 'transform', `translate(${width / 2} ${ground}) scale(${scale})`);
    attr('sun', 'cx', width * .81); attr('sun', 'cy', Math.max(87, horizon * .32));
    attr('sun', 'r', width < 600 ? 27 : 36);
    attr('islands', 'd', `M0 ${horizon + 2}Q${width * .08} ${horizon - 60} ${width * .19} ${horizon - 16}Q${width * .27} ${horizon - 53} ${width * .38} ${horizon + 2}Z M${width * .66} ${horizon + 2}Q${width * .82} ${horizon - 62} ${width} ${horizon - 27}V${horizon + 2}Z`);
    attr('sea', 'y', horizon); attr('sea', 'height', height - horizon);
    attr('horizon', 'd', `M0 ${horizon}H${width}`);
    attr('lighthouse', 'transform', `translate(${width * .13} ${horizon}) scale(${width < 600 ? .5 : .75})`);
    attr('shore', 'd', `M0 ${ground - 60 * scale}Q${width * .45} ${ground - 86 * scale} ${width} ${ground - 58 * scale}V${height}H0Z`);
    attr('road', 'd', `M0 ${ground - 27 * scale}H${width}V${height + 2}H0Z`);
    nodes.ripples.innerHTML = Array.from({ length: 22 }, (_, i) => `<path d="M${(i * 177) % (width + 100) - 50} ${horizon + 20 + (i % 4) * 21 * scale}h${20 + i % 3 * 15}"/>`).join('');
    nodes['road-marks'].innerHTML = Array.from({ length: Math.ceil(width / (180 * scale)) + 2 }, (_, i) => `<path d="M${i * 180 * scale} ${ground + 47 * scale}h${64 * scale}"/>`).join('');
    nodes['road-plants'].innerHTML = Array.from({ length: Math.ceil(width / (360 * scale)) + 2 }, (_, i) => `<use href="#tuft" transform="translate(${i * 360 * scale} ${ground - 29 * scale}) scale(${.34 * scale})"/>`).join('');
    attr('foreground-left', 'transform', `translate(24 ${height + 8}) scale(${width < 600 ? .9 : 1.4})`);
    attr('foreground-right', 'transform', `translate(${width - 25} ${height + 12}) scale(${width < 600 ? 1.2 : 1.8})`);
    render();
  }

  function schedule() {
    if (!frameId && !document.hidden && (playing || bellTime > 0)) frameId = requestFrame(frame);
  }
  function frame(now) {
    frameId = 0;
    const dt = last === null ? 0 : Math.min((now - last) / 1000, .05);
    last = now;
    if (playing) time += dt * speed;
    bellTime = Math.max(0, bellTime - dt);
    render(); schedule();
  }
  function setPlaying(value) {
    playing = value; last = null;
    cancelFrame(frameId); frameId = 0;
    toggle.setAttribute('aria-label', playing ? '暂停动画' : '继续动画');
    toggle.setAttribute('aria-pressed', String(!playing));
    if (toggle.dataset) toggle.dataset.tip = playing ? '暂停' : '继续';
    const pauseIcon = byId('pause-icon'), playIcon = byId('play-icon');
    if (pauseIcon.toggleAttribute) pauseIcon.toggleAttribute('hidden', !playing); else if (!playing) pauseIcon.setAttribute('hidden', '');
    if (playIcon.toggleAttribute) playIcon.toggleAttribute('hidden', playing); else if (playing) playIcon.setAttribute('hidden', '');
    render(); schedule();
  }
  toggle.addEventListener('click', () => setPlaying(!playing));
  byId('speedRange').addEventListener('input', event => {
    speed = Number(event.target.value);
    byId('speedValue').textContent = `${speed.toFixed(1)}×`;
    event.target.setAttribute('aria-valuetext', `${speed.toFixed(1)} 倍速度`);
  });
  byId('bell').addEventListener('click', async () => {
    bellTime = 1; last = null; render(); schedule();
    byId('announcement').textContent = '叮铃！';
    const Audio = window.AudioContext || window.webkitAudioContext;
    if (!Audio) return;
    try {
      audio ||= new Audio();
      if (audio.state === 'suspended') await audio.resume();
      for (const delay of [0, .12]) {
        const start = audio.currentTime + delay;
        const oscillator = audio.createOscillator(), gain = audio.createGain();
        oscillator.frequency.value = 1568;
        gain.gain.setValueAtTime(0, start);
        gain.gain.linearRampToValueAtTime(.12, start + .006);
        gain.gain.exponentialRampToValueAtTime(.0001, start + .65);
        oscillator.connect(gain); gain.connect(audio.destination);
        oscillator.start(start); oscillator.stop(start + .7);
        oscillator.onended = () => { oscillator.disconnect(); gain.disconnect(); };
      }
    } catch { /* Visual feedback remains available when audio is blocked. */ }
  });
  document.addEventListener('keydown', event => {
    if (event.code === 'Space' && !event.repeat && !event.target.closest('button,input,textarea,select,[contenteditable]')) {
      event.preventDefault(); setPlaying(!playing);
    }
  });
  document.addEventListener('visibilitychange', () => {
    cancelFrame(frameId); frameId = 0; last = null; schedule();
  });
  motion.addEventListener('change', event => { if (event.matches) setPlaying(false); });
  if (typeof ResizeObserver === 'function') new ResizeObserver(resize).observe(scene);
  window.__pelicanAnimation = {
    legLengths: { upper: 112, lower: 118 },
    render(milliseconds = 0) { time = Number(milliseconds) / 1000; render(); },
    setPlaying(value) { setPlaying(Boolean(value)); if (value) last = 0; },
    setSpeed(value) { speed = Number(value); const input = byId('speedRange'); input.value = String(speed); byId('speedValue').textContent = `${speed.toFixed(1)}×`; },
    restart() { time = 0; last = 0; bellTime = 0; render(); },
    getState() { return { elapsed: time, speed, playing }; }
  };
  resize(); setPlaying(playing);
})();
</script>
</body>
</html>
