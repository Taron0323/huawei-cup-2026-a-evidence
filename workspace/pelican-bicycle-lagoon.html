<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#d9eff3">
  <link rel="icon" href="data:,">
  <title>鹈鹕的蓝湾骑行</title>
  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #1d4050;
      background: #d9eff3;
      color-scheme: light;
    }

    * { box-sizing: border-box; letter-spacing: 0; }
    body { margin: 0; min-width: 260px; background: #d9eff3; }
    main { height: 100vh; height: 100svh; min-height: 360px; display: flex; flex-direction: column; overflow: hidden; }
    .scene { position: relative; flex: 1; min-height: 0; overflow: hidden; background: #d9eff3; }
    #landscape { display: block; width: 100%; height: 100%; }
    .scene-copy { position: absolute; z-index: 2; top: 26px; left: 30px; pointer-events: none; }
    h1 { margin: 0; color: #174557; font-size: 28px; line-height: 1.2; font-weight: 720; text-shadow: 0 2px 18px rgba(255,255,255,.46); }
    .lede { margin: 10px 0 0; color: #386876; font-size: 13px; line-height: 1.45; }
    .scene-copy::after { content: ""; display: block; width: 42px; height: 3px; margin-top: 14px; border-radius: 2px; background: #e58257; }

    footer { flex: none; min-height: 86px; padding: 18px 22px max(18px, env(safe-area-inset-bottom)); border-top: 1px solid #b5d4d6; background: #fbf7ec; color: #1d4050; }
    .controls { max-width: 520px; margin: 0 auto; display: flex; align-items: center; gap: 13px; }
    button { position: relative; width: 44px; height: 44px; flex: 0 0 44px; display: grid; place-items: center; border: 1px solid #a7cbd0; border-radius: 8px; background: #fffdf4; color: #1e6170; cursor: pointer; touch-action: manipulation; }
    button:hover { background: #e4f2f1; }
    button:active { transform: translateY(1px); }
    #toggle { border-color: #1e6170; background: #1e6170; color: #fffdf4; }
    #toggle:hover { background: #174f5d; }
    button svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    button::after { content: attr(data-tip); position: absolute; z-index: 4; bottom: 53px; left: 50%; transform: translateX(-50%); padding: 6px 9px; border-radius: 4px; background: #1d4050; color: #fffdf4; font-size: 12px; line-height: 1; white-space: nowrap; opacity: 0; pointer-events: none; }
    button:hover::after, button:focus-visible::after { opacity: 1; }
    :focus-visible { outline: 3px solid #e58257; outline-offset: 4px; }
    [hidden] { display: none !important; }
    .divider { width: 1px; height: 25px; flex: 0 0 1px; margin: 0 2px; background: #c8d9d1; }
    label { flex: 0 0 auto; font-size: 13px; white-space: nowrap; }
    input[type="range"] { width: 100%; min-width: 50px; margin: 0; accent-color: #e58257; cursor: pointer; }
    output { flex: 0 0 39px; color: #1d4050; font-size: 13px; font-variant-numeric: tabular-nums; text-align: right; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

    @media (max-width: 600px) {
      .scene-copy { top: 17px; left: 19px; }
      h1 { font-size: 22px; }
      .lede { display: none; }
      .scene-copy::after { width: 30px; height: 2px; margin-top: 10px; }
      footer { min-height: 80px; padding: 15px 15px max(15px, env(safe-area-inset-bottom)); }
      .controls { gap: 10px; }
      button { width: 42px; height: 42px; flex-basis: 42px; }
      .divider { margin: 0; }
      label { font-size: 12px; }
      output { flex-basis: 35px; font-size: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      #landscape * { animation: none !important; transition: none !important; }
    }
  </style>
</head>

<script>
(() => {
  'use strict';
  const byId = id => document.getElementById(id);
  const scene = byId('scene');
  const svg = byId('landscape');
  const toggle = byId('toggle');
  const motion = typeof window !== 'undefined' && typeof window.matchMedia === 'function'
    ? window.matchMedia('(prefers-reduced-motion: reduce)')
    : { matches: false, addEventListener() {}, addListener() {} };
  const nodes = {};
  if (svg && typeof svg.querySelectorAll === 'function') svg.querySelectorAll('[id]').forEach(node => { nodes[node.id] = node; });
  const attr = (id, name, value) => { if (nodes[id]) nodes[id].setAttribute(name, String(value)); };
  const wrap = (number, length) => ((number % length) + length) % length;
  let width = 1440, height = 820, ground = 710, scale = 1, horizon = 470;
  const initialPhase = 28.4 * Math.PI / 180 / 1.65;
  let time = 0, speed = 1, playing = !motion.matches, frameId = 0, last = null, bellTime = 0, audio;

  function solveLeg(side, phase, bob, far) {
    const px = Math.cos(phase) * 39;
    const py = -122 + Math.sin(phase) * 39;
    const hx = far ? -89 : -79;
    const hy = -291 + bob;
    const ax = px;
    const ay = py - 17;
    const dx = ax - hx;
    const dy = ay - hy;
    const distance = Math.max(1, Math.hypot(dx, dy));
    const upper = 125;
    const lower = 124;
    const along = (upper * upper - lower * lower + distance * distance) / (2 * distance);
    const bend = Math.sqrt(Math.max(0, upper * upper - along * along));
    const kx = hx + along * dx / distance + bend * dy / distance;
    const ky = hy + along * dy / distance - bend * dx / distance;
    const path = `M${hx} ${hy}L${kx} ${ky}L${ax} ${ay}`;
    attr(`${side}Leg`, 'd', path);
    attr(`${side}-leg-color`, 'd', path);
    attr(`${side}-crank`, 'd', `M0-122L${px} ${py}`);
    attr(`${side}-foot`, 'transform', `translate(${px} ${py})`);
  }

  function render() {
    const angle = time * 2.9 + initialPhase;
    const bob = Math.sin(time * 5.8) * 2.7;
    const drift = Math.sin(time * .68) * 8;
    const riderY = ground + bob;
    attr('rider', 'transform', `translate(${width / 2 + drift} ${riderY}) scale(${scale})`);
    attr('back-wheel', 'transform', `rotate(${angle * 180 / Math.PI})`);
    attr('front-wheel', 'transform', `rotate(${angle * 180 / Math.PI})`);
    solveLeg('near', angle, bob, false);
    solveLeg('far', angle + Math.PI, bob, true);
    const scarfWave = Math.sin(time * 6.2) * 3;
    attr('scarf-tail', 'transform', `translate(0 ${scarfWave})`);
    const wingLift = Math.sin(time * 5.8 + .8) * 2.8;
    attr('wing', 'transform', `rotate(${wingLift} -35 -335)`);
    const bellOpacity = bellTime > 0 ? Math.min(1, bellTime * 8) : 0;
    attr('bell-rays', 'opacity', bellOpacity);
    if (bellTime > 0) bellTime -= .016;
  }

  function resize() {
    const box = scene.getBoundingClientRect();
    width = Math.max(1, box.width);
    height = Math.max(1, box.height);
    const shortLandscape = width >= 600 && height < 400;
    ground = height * (shortLandscape ? .78 : width < 600 ? .72 : .84);
    const topClearance = shortLandscape ? 34 : width < 600 ? 22 : 34;
    scale = Math.max(.1, Math.min((width - 28) / 620, (ground - topClearance) / 540, 1.12));
    horizon = Math.max(84, ground - 210 * scale);
    svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
    attr('sun', 'cx', width * .81); attr('sun', 'cy', Math.max(74, horizon * .31));
    attr('sun-ring', 'cx', width * .81); attr('sun-ring', 'cy', Math.max(74, horizon * .31));
    attr('sun', 'r', width < 600 ? 29 : 44); attr('sun-ring', 'r', width < 600 ? 46 : 67);
    attr('far-hills', 'd', `M0 ${horizon + 2}Q${width * .08} ${horizon - 87} ${width * .19} ${horizon - 18}Q${width * .27} ${horizon - 67} ${width * .38} ${horizon + 2}Q${width * .55} ${horizon - 79} ${width * .73} ${horizon + 2}Q${width * .83} ${horizon - 68} ${width} ${horizon - 8}V${horizon + 93}H0Z`);
    attr('near-hills', 'd', `M0 ${horizon + 44}Q${width * .13} ${horizon - 33} ${width * .27} ${horizon + 32}Q${width * .4} ${horizon - 41} ${width * .55} ${horizon + 34}Q${width * .73} ${horizon - 44} ${width} ${horizon + 24}V${horizon + 105}H0Z`);
    attr('water', 'y', horizon + 42); attr('water', 'height', Math.max(0, height - horizon - 42));
    attr('horizon-line', 'd', `M0 ${horizon + 42}H${width}`);
    attr('island', 'd', `M0 ${horizon + 115}Q${width * .12} ${horizon + 72} ${width * .27} ${horizon + 106}Q${width * .42} ${horizon + 48} ${width * .59} ${horizon + 107}Q${width * .75} ${horizon + 55} ${width} ${horizon + 105}V${horizon + 186}H0Z`);
    attr('shore', 'd', `M0 ${ground - 62 * scale}Q${width * .34} ${ground - 99 * scale} ${width * .59} ${ground - 63 * scale}Q${width * .79} ${ground - 88 * scale} ${width} ${ground - 64 * scale}V${height}H0Z`);
    attr('road', 'd', `M0 ${ground - 27 * scale}H${width}V${height + 2}H0Z`);
    nodes['water-glints'].innerHTML = Array.from({ length: 22 }, (_, i) => `<path d="M${(i * 177) % (width + 100) - 50} ${horizon + 63 + (i % 4) * 21 * scale}h${20 + i % 3 * 15}"/>`).join('');
    nodes['road-marks'].innerHTML = Array.from({ length: Math.ceil(width / Math.max(90, 180 * scale)) + 2 }, (_, i) => `<path d="M${i * 180 * scale} ${ground + 47 * scale}h${64 * scale}"/>`).join('');
    nodes['road-reeds'].innerHTML = Array.from({ length: Math.ceil(width / Math.max(180, 340 * scale)) + 2 }, (_, i) => `<use href="#reed-shape" transform="translate(${i * 340 * scale} ${ground - 28 * scale}) scale(${Math.max(.32, .55 * scale)})"/>`).join('');
    render();
  }

  function loop(now) {
    if (last === null) last = now;
    const delta = Math.min(48, now - last) / 1000;
    last = now;
    if (playing) time += delta * speed;
    render();
    frameId = requestFrame(loop);
  }

  function requestFrame(callback) {
    return typeof window !== 'undefined' && typeof window.requestAnimationFrame === 'function' ? window.requestAnimationFrame(callback) : 0;
  }

  function setPlaying(value) {
    playing = Boolean(value);
    toggle.setAttribute('aria-pressed', String(!playing));
    toggle.setAttribute('aria-label', playing ? '暂停动画' : '继续动画');
    toggle.dataset.tip = playing ? '暂停' : '继续';
    byId('pause-icon').hidden = !playing;
    byId('play-icon').hidden = playing;
    byId('announcement').textContent = playing ? '动画已继续' : '动画已暂停';
  }

  toggle.addEventListener('click', () => setPlaying(!playing));
  byId('speedRange').addEventListener('input', event => {
    speed = Number(event.target.value);
    byId('speedValue').textContent = `${speed.toFixed(1)}×`;
    event.target.setAttribute('aria-valuetext', `${speed.toFixed(1)} 倍速度`);
  });
  byId('bell').addEventListener('click', () => {
    bellTime = .48;
    byId('announcement').textContent = '铃声已响起';
    try {
      audio ||= new (window.AudioContext || window.webkitAudioContext)();
      const oscillator = audio.createOscillator();
      const gain = audio.createGain();
      oscillator.type = 'sine'; oscillator.frequency.setValueAtTime(660, audio.currentTime);
      oscillator.frequency.exponentialRampToValueAtTime(440, audio.currentTime + .18);
      gain.gain.setValueAtTime(.0001, audio.currentTime);
      gain.gain.exponentialRampToValueAtTime(.08, audio.currentTime + .015);
      gain.gain.exponentialRampToValueAtTime(.0001, audio.currentTime + .24);
      oscillator.connect(gain).connect(audio.destination); oscillator.start(); oscillator.stop(audio.currentTime + .25);
    } catch (_) {}
  });
  document.addEventListener('keydown', event => {
    if (event.code === 'Space' && !/input|button/i.test(event.target.tagName)) { event.preventDefault(); setPlaying(!playing); }
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden) { last = null; } });
  const motionListener = event => { if (event.matches) setPlaying(false); };
  if (motion.addEventListener) motion.addEventListener('change', motionListener); else if (motion.addListener) motion.addListener(motionListener);
  if (typeof ResizeObserver === 'function') new ResizeObserver(resize).observe(scene); else window.addEventListener('resize', resize);

  window.__pelicanAnimation = {
    legLengths: { upper: 125, lower: 124 },
    render(milliseconds = 0) { time = Number(milliseconds) / 1000; render(); },
    setPlaying(value) { setPlaying(Boolean(value)); if (value) last = 0; },
    setSpeed(value) {
      speed = Number(value);
      const input = byId('speedRange');
      input.value = String(speed);
      byId('speedValue').textContent = `${speed.toFixed(1)}×`;
      input.setAttribute('aria-valuetext', `${speed.toFixed(1)} 倍速度`);
    },
    restart() { time = 0; last = 0; bellTime = 0; render(); },
    getState() { return { elapsed: time, speed, playing }; }
  };
  resize();
  setPlaying(playing);
  frameId = requestFrame(loop);
  window.addEventListener('beforeunload', () => { if (frameId) cancelAnimationFrame(frameId); });
})();
</script>
</body>
</html>
