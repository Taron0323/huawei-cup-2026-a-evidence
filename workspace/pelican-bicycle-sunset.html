<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#182b3d">
  <title>鹈鹕的暮色骑行</title>
  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #f8f1df;
      background: #182b3d;
      color-scheme: dark;
    }

    * { box-sizing: border-box; letter-spacing: 0; }
    body { margin: 0; min-width: 260px; background: #182b3d; }
    main { height: 100vh; height: 100svh; min-height: 360px; display: flex; flex-direction: column; overflow: hidden; }
    .scene { position: relative; flex: 1; min-height: 0; overflow: hidden; background: #182b3d; }
    #landscape { display: block; width: 100%; height: 100%; }
    .scene-copy { position: absolute; z-index: 2; top: 24px; left: 28px; pointer-events: none; }
    h1 { margin: 0; color: #fff7e7; font-size: 26px; line-height: 1.25; font-weight: 650; text-shadow: 0 2px 18px rgba(11, 25, 38, .38); }
    .lede { margin: 9px 0 0; color: #f0d7b8; font-size: 13px; line-height: 1.45; }
    .scene-copy::after { content: ""; display: block; width: 38px; height: 3px; margin-top: 13px; border-radius: 2px; background: #efad67; }

    footer { flex: none; min-height: 84px; padding: 18px 22px max(18px, env(safe-area-inset-bottom)); border-top: 1px solid #d9cbb5; background: #f7f0df; color: #253a48; }
    .controls { max-width: 520px; margin: 0 auto; display: flex; align-items: center; gap: 13px; }
    button { position: relative; width: 44px; height: 44px; flex: 0 0 44px; display: grid; place-items: center; border: 1px solid #c6c7b6; border-radius: 8px; background: #fffaf0; color: #294954; cursor: pointer; touch-action: manipulation; }
    button:hover { background: #ece4d2; }
    button:active { transform: translateY(1px); }
    #toggle { border-color: #294954; background: #294954; color: #fffaf0; }
    #toggle:hover { background: #1e3841; }
    button svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    button::after { content: attr(data-tip); position: absolute; z-index: 4; bottom: 53px; left: 50%; transform: translateX(-50%); padding: 6px 9px; border-radius: 4px; background: #253a48; color: #fffaf0; font-size: 12px; line-height: 1; white-space: nowrap; opacity: 0; pointer-events: none; }
    button:hover::after, button:focus-visible::after { opacity: 1; }
    :focus-visible { outline: 3px solid #d97854; outline-offset: 4px; }
    [hidden] { display: none !important; }
    .divider { width: 1px; height: 25px; flex: 0 0 1px; margin: 0 2px; background: #d6cbb8; }
    label { flex: 0 0 auto; font-size: 13px; white-space: nowrap; }
    input[type="range"] { width: 100%; min-width: 50px; margin: 0; accent-color: #d97854; cursor: pointer; }
    output { flex: 0 0 39px; color: #253a48; font-size: 13px; font-variant-numeric: tabular-nums; text-align: right; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

    @media (max-width: 600px) {
      .scene-copy { top: 17px; left: 19px; }
      h1 { font-size: 21px; }
      .lede { display: none; }
      .scene-copy::after { width: 29px; height: 2px; margin-top: 9px; }
      footer { min-height: 78px; padding: 15px 15px max(15px, env(safe-area-inset-bottom)); }
      .controls { gap: 10px; }
      button { width: 42px; height: 42px; flex-basis: 42px; }
      .divider { margin: 0; }
      label { font-size: 12px; }
      output { flex-basis: 35px; font-size: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      #landscape * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>

          <path d="M111-260L101-286Q99-300 115-300H149" fill="none" stroke="#bdceca" stroke-width="4"/>

  <footer>
    <div class="controls" role="group" aria-label="骑行动画控制">
      <button id="toggle" type="button" aria-label="暂停动画" aria-pressed="false" data-tip="暂停">

        <svg id="play-icon" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/></svg>

</main>
<script>
(() => {
  'use strict';
  const byId = id => document.getElementById(id);
  const scene = byId('scene');
  const svg = byId('landscape');
  const toggle = byId('toggle');
  const motion = typeof window !== 'undefined' && typeof window.matchMedia === 'function'
    ? window.matchMedia('(prefers-reduced-motion: reduce)')
    : { matches: false, addEventListener() {}, addListener() {} };
  const nodes = {};
  if (svg && typeof svg.querySelectorAll === 'function') svg.querySelectorAll('[id]').forEach(node => { nodes[node.id] = node; });
  ['scene', 'landscape', 'moon', 'moon-ring', 'far-hills', 'near-hills', 'water', 'horizon-line', 'water-glints', 'island', 'road', 'road-marks', 'road-reeds', 'rider', 'farLeg', 'far-leg-color', 'far-crank', 'far-foot', 'back-wheel', 'front-wheel', 'nearLeg', 'near-leg-color', 'near-crank', 'near-foot', 'pelican', 'scarf-tail', 'wing', 'eye', 'bell-rays', 'foreground-left', 'foreground-right'].forEach(id => {
    if (!nodes[id]) nodes[id] = byId(id);
  });

  const attr = (id, name, value) => { if (nodes[id]) nodes[id].setAttribute(name, String(value)); };
  const wrap = (number, length) => ((number % length) + length) % length;
  let width = 1440, height = 820, ground = 710, scale = 1, horizon = 470;
  const initialPhase = 28.4 * Math.PI / 180 / 1.65;
  let time = 0, speed = 1, playing = !motion.matches, frameId = 0, last = null, bellTime = 0, audio;
  const legs = [{ side: 'near', far: false }, { side: 'far', far: true }];
  const requestFrame = callback => typeof window !== 'undefined' && typeof window.requestAnimationFrame === 'function' ? window.requestAnimationFrame(callback) : 0;
  const cancelFrame = id => { if (typeof window !== 'undefined' && typeof window.cancelAnimationFrame === 'function') window.cancelAnimationFrame(id); };

  function leg(side, phase, bob, far) {
    const px = Math.cos(phase) * 39;
    const py = -122 + Math.sin(phase) * 39;
    const hx = far ? -89 : -79;
    const hy = -291 + bob;
    const ax = px;
    const ay = py - 17;
    const dx = ax - hx;
    const dy = ay - hy;
    const distance = Math.hypot(dx, dy);
    const along = (112 ** 2 - 118 ** 2 + distance ** 2) / (2 * distance);
    const bend = Math.sqrt(Math.max(0, 112 ** 2 - along ** 2));
    const kx = hx + along * dx / distance + bend * dy / distance;
    const ky = hy + along * dy / distance - bend * dx / distance;
    const path = `M${hx} ${hy}L${kx} ${ky}L${ax} ${ay}`;
    attr(`${side}Leg`, 'd', path);
    attr(`${side}-leg-color`, 'd', path);
    attr(`${side}-crank`, 'd', `M0-122L${px} ${py}`);
    attr(`${side}-foot`, 'transform', `translate(${px} ${py})`);
  }

  function render() {
    const angle = time * 2.9 + initialPhase;
    const wheelAngle = angle * 1.65;
    const distance = wheelAngle * 94;
    const bob = Math.sin(angle * 2) * 2.4;
    const wheelDegrees = (wheelAngle * 180 / Math.PI).toFixed(2);
    attr('back-wheel', 'transform', `rotate(${wheelDegrees})`);
    attr('front-wheel', 'transform', `rotate(${wheelDegrees})`);
    legs.forEach(({ side, far }) => leg(side, angle + (far ? Math.PI : 0), bob, far));
    attr('pelican', 'transform', `translate(0 ${bob})`);
    const flutter = Math.sin(time * 6) * 7;
    attr('scarf-tail', 'd', `M24-428Q-14-452-64-437Q-94 ${-429 + flutter}-119 ${-447 + flutter}L-108 ${-417 + flutter}L-80 ${-425 + flutter}Q-29-418 29-414Z`);
    attr('wing', 'd', `M-127-366C-87-390-41-365-13-344Q35-310 81-304L132 ${-300 - bob}Q147 ${-302 - bob} 146 ${-294 - bob}Q128 ${-282 - bob} 111-288Q119-279 104-281L67-287Q-13-303-46-315Q-93-302-130-321Q-150-332-127-366Z`);
    attr('eye', 'transform', `translate(75 -474) scale(1 ${time % 7.5 > 7.32 ? 0.12 : 1})`);
    attr('moon-ring', 'opacity', (.21 + Math.sin(time * .55) * .05).toFixed(2));
    attr('star-layer', 'opacity', (.78 + Math.sin(time * .45) * .1).toFixed(2));
    attr('water-glints', 'transform', `translate(${-wrap(distance * .055, width + 160)} 0)`);
    attr('road-marks', 'transform', `translate(${-wrap(distance * scale, 192 * scale)} 0)`);
    attr('road-reeds', 'transform', `translate(${-wrap(distance * scale, 360 * scale)} 0)`);
    attr('bell-rays', 'opacity', Math.min(1, bellTime * 3));
    attr('bell-rays', 'stroke-width', 2.5 + Math.sin(bellTime * 25));
  }

  function resize() {
    const box = scene && typeof scene.getBoundingClientRect === 'function' ? scene.getBoundingClientRect() : { width, height };
    width = Math.max(1, box.width);
    height = Math.max(1, box.height);
    const shortLandscape = width >= 600 && height < 420;
    ground = height * (shortLandscape ? .9 : width < 600 ? .82 : .86);
    const topClearance = shortLandscape ? 74 : width < 600 ? 92 : 54;
    scale = Math.max(.1, Math.min((width - 30) / 620, (ground - topClearance) / 510, 1.18));
    horizon = ground - 220 * scale;
    svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
    attr('rider', 'transform', `translate(${width * .53} ${ground}) scale(${scale})`);
    attr('moon', 'cx', width * .79); attr('moon', 'cy', Math.max(64, horizon * .36)); attr('moon', 'r', width < 600 ? 27 : 39);
    attr('moon-ring', 'cx', width * .79); attr('moon-ring', 'cy', Math.max(64, horizon * .36)); attr('moon-ring', 'r', width < 600 ? 41 : 57);
    attr('far-hills', 'd', `M0 ${horizon - 49}Q${width * .08} ${horizon - 131} ${width * .18} ${horizon - 57}Q${width * .3} ${horizon - 146} ${width * .44} ${horizon - 54}Q${width * .6} ${horizon - 134} ${width * .73} ${horizon - 55}Q${width * .86} ${horizon - 130} ${width} ${horizon - 54}V${horizon + 35}H0Z`);
    attr('near-hills', 'd', `M0 ${horizon - 13}Q${width * .12} ${horizon - 75} ${width * .25} ${horizon - 17}Q${width * .39} ${horizon - 86} ${width * .54} ${horizon - 11}Q${width * .69} ${horizon - 79} ${width * .83} ${horizon - 14}Q${width * .92} ${horizon - 52} ${width} ${horizon - 16}V${horizon + 45}H0Z`);
    attr('water', 'y', horizon); attr('water', 'height', height - horizon);
    attr('horizon-line', 'd', `M0 ${horizon}H${width}`);
    attr('island', 'd', `M0 ${horizon + 70}Q${width * .1} ${horizon + 28} ${width * .22} ${horizon + 61}Q${width * .37} ${horizon + 4} ${width * .52} ${horizon + 64}Q${width * .7} ${horizon + 10} ${width * .83} ${horizon + 57}Q${width * .93} ${horizon + 30} ${width} ${horizon + 63}V${ground - 57 * scale}H0Z`);
    attr('shore', 'd', `M0 ${ground - 60 * scale}Q${width * .25} ${ground - 103 * scale} ${width * .5} ${ground - 63 * scale}Q${width * .75} ${ground - 100 * scale} ${width} ${ground - 58 * scale}V${height}H0Z`);
    attr('road', 'd', `M0 ${ground - 26 * scale}H${width}V${height + 2}H0Z`);
    nodes['water-glints'].innerHTML = Array.from({ length: 28 }, (_, index) => `<path d="M${(index * 149) % (width + 130) - 60} ${horizon + 22 + (index % 5) * 18 * scale}h${18 + index % 4 * 14}" stroke-width="${1 + index % 3 * .5}"/>`).join('');
    nodes['road-marks'].innerHTML = Array.from({ length: Math.ceil(width / (192 * scale)) + 3 }, (_, index) => `<path d="M${index * 192 * scale} ${ground + 47 * scale}h${70 * scale}"/>`).join('');
    nodes['road-reeds'].innerHTML = Array.from({ length: Math.ceil(width / (360 * scale)) + 3 }, (_, index) => `<use href="#reed-shape" transform="translate(${index * 360 * scale} ${ground - 25 * scale}) scale(${.48 * scale})"/>`).join('');
    attr('foreground-left', 'transform', `translate(20 ${height + 9}) scale(${width < 600 ? .9 : 1.5})`);
    attr('foreground-right', 'transform', `translate(${width - 24} ${height + 10}) scale(${width < 600 ? 1.15 : 1.9})`);
    render();
  }

  function schedule() {
    if (!frameId && !document.hidden && (playing || bellTime > 0)) frameId = requestFrame(frame);
  }

  function frame(now) {
    frameId = 0;
    const delta = last === null ? 0 : Math.min((now - last) / 1000, .05);
    last = now;
    if (playing) time += delta * speed;
    bellTime = Math.max(0, bellTime - delta);
    render();
    schedule();
  }

  function setPlaying(value) {
    playing = Boolean(value);
    last = null;
    cancelFrame(frameId);
    frameId = 0;
    toggle.setAttribute('aria-label', playing ? '暂停动画' : '继续动画');
    toggle.setAttribute('aria-pressed', String(!playing));
    if (toggle.dataset) toggle.dataset.tip = playing ? '暂停' : '继续';
    const pauseIcon = byId('pause-icon');
    const playIcon = byId('play-icon');
    if (pauseIcon.toggleAttribute) pauseIcon.toggleAttribute('hidden', !playing); else if (!playing) pauseIcon.setAttribute('hidden', '');
    if (playIcon.toggleAttribute) playIcon.toggleAttribute('hidden', playing); else if (playing) playIcon.setAttribute('hidden', '');
    render();
    schedule();
  }

  toggle.addEventListener('click', () => setPlaying(!playing));
  byId('speedRange').addEventListener('input', event => {
    speed = Number(event.target.value);
    byId('speedValue').textContent = `${speed.toFixed(1)}×`;
    event.target.setAttribute('aria-valuetext', `${speed.toFixed(1)} 倍速度`);
  });
  byId('bell').addEventListener('click', async () => {
    bellTime = 1;
    last = null;
    render();
    schedule();
    byId('announcement').textContent = '叮铃！';
    const Audio = window.AudioContext || window.webkitAudioContext;
    if (!Audio) return;
    try {
      audio ||= new Audio();
      if (audio.state === 'suspended') await audio.resume();
      for (const delay of [0, .12]) {
        const start = audio.currentTime + delay;
        const oscillator = audio.createOscillator();
        const gain = audio.createGain();
        oscillator.frequency.value = 1568;
        gain.gain.setValueAtTime(0, start);
        gain.gain.linearRampToValueAtTime(.12, start + .006);
        gain.gain.exponentialRampToValueAtTime(.0001, start + .65);
        oscillator.connect(gain); gain.connect(audio.destination);
        oscillator.start(start); oscillator.stop(start + .7);
        oscillator.onended = () => { oscillator.disconnect(); gain.disconnect(); };
      }
    } catch { /* Visual feedback remains available when audio is blocked. */ }
  });
  document.addEventListener('keydown', event => {
    if (event.code === 'Space' && !event.repeat && !event.target.closest('button,input,textarea,select,[contenteditable]')) {
      event.preventDefault();
      setPlaying(!playing);
    }
  });
  document.addEventListener('visibilitychange', () => {
    cancelFrame(frameId);
    frameId = 0;
    last = null;
    schedule();
  });
  const motionListener = event => { if (event.matches) setPlaying(false); };
  if (motion.addEventListener) motion.addEventListener('change', motionListener); else if (motion.addListener) motion.addListener(motionListener);
  if (typeof ResizeObserver === 'function') new ResizeObserver(resize).observe(scene); else if (typeof window !== 'undefined') window.addEventListener('resize', resize);

  window.__pelicanAnimation = {
    legLengths: { upper: 112, lower: 118 },
    render(milliseconds = 0) { time = Number(milliseconds) / 1000; render(); },
    setPlaying(value) { setPlaying(Boolean(value)); if (value) last = 0; },
    setSpeed(value) { speed = Number(value); const input = byId('speedRange'); input.value = String(speed); byId('speedValue').textContent = `${speed.toFixed(1)}×`; },
    restart() { time = 0; last = 0; bellTime = 0; render(); },
    getState() { return { elapsed: time, speed, playing }; }
  };
  resize();
  setPlaying(playing);
})();
</script>
</body>
</html>
